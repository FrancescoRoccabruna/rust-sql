[package]
name = "rust-sql"
version = "0.1.0"
edition = "2024"
description = "A Rust client library for PostgreSQL and MySQL"
license = "MIT"
keywords = ["sql", "postgres", "mysql", "database", "client"]
categories = ["database"]

[workspace]
members = ["rust-sql-derive"]


[dependencies]
rust-sql-derive = { path = "rust-sql-derive" }

base64 = "0.23.1"
hmac = "0.13"
pbkdf2 = "0.13"
rand = "0.10.3"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.11"